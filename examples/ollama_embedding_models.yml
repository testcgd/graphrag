# Example: Different Embedding Models for GraphRAG with Ollama
#
# This configuration showcases various embedding models available in Ollama
# and how to use them with GraphRAG for optimal performance.
#
# Embedding models create vector representations of text for semantic search.
# Different models offer trade-offs between:
# - Quality (accuracy of semantic similarity)
# - Speed (inference time)
# - Size (dimensions, memory usage)
# - Language support

# =============================================================================
# POPULAR EMBEDDING MODELS IN OLLAMA
# =============================================================================
#
# Model Comparison:
#
# 1. nomic-embed-text (Recommended Default)
#    - Dimensions: 768
#    - Size: ~274 MB
#    - Quality: Excellent
#    - Speed: Fast
#    - Languages: English-focused, some multilingual
#    - Best for: General purpose, balanced performance
#
# 2. mxbai-embed-large
#    - Dimensions: 1024
#    - Size: ~669 MB
#    - Quality: Best
#    - Speed: Medium
#    - Languages: English-focused
#    - Best for: High-quality applications, when quality > speed
#
# 3. snowflake-arctic-embed
#    - Dimensions: 1024
#    - Size: ~669 MB
#    - Quality: Excellent
#    - Speed: Medium-Fast
#    - Languages: English
#    - Best for: Retrieval tasks, high precision
#
# 4. all-minilm (all-minilm:l6-v2)
#    - Dimensions: 384
#    - Size: ~23 MB
#    - Quality: Good
#    - Speed: Very Fast
#    - Languages: English
#    - Best for: Speed-critical apps, resource-constrained
#
# 5. bge-m3 (Chinese-friendly)
#    - Dimensions: 1024
#    - Size: ~2.3 GB
#    - Quality: Excellent
#    - Speed: Medium
#    - Languages: Multilingual (strong Chinese support)
#    - Best for: Multilingual content, especially Chinese
#
# 6. paraphrase-multilingual
#    - Dimensions: 768
#    - Size: ~471 MB
#    - Quality: Good
#    - Speed: Fast
#    - Languages: 50+ languages
#    - Best for: True multilingual applications
#
# 7. bge-large-en-v1.5
#    - Dimensions: 1024
#    - Size: ~1.34 GB
#    - Quality: Excellent
#    - Speed: Medium
#    - Languages: English
#    - Best for: English-only, high quality
#
# Note: Gemma models are primarily LLMs (chat), not embedding models.
# For embeddings with Google-like quality, use bge-* or nomic-embed-text.

# =============================================================================
# CONFIGURATION EXAMPLES
# =============================================================================

# --- EXAMPLE 1: Default Recommended Setup ---
# Best balance of quality, speed, and compatibility

models:
  default_chat_model:
    type: ollama_chat
    model: qwen2.5:14b  # Excellent multilingual chat model
    api_base: http://localhost:11434/v1
    max_tokens: 4000
    temperature: 0.0
    concurrent_requests: 4
    async_mode: threaded

  default_embedding_model:
    type: ollama_embedding
    model: nomic-embed-text  # Recommended default
    api_base: http://localhost:11434/v1
    concurrent_requests: 8
    async_mode: threaded

