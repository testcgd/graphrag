# =============================================================================
# SETUP INSTRUCTIONS
# =============================================================================

# 1. Pull the embedding model you want to use:
#
#    # Recommended default
#    ollama pull nomic-embed-text
#
#    # High quality
#    ollama pull mxbai-embed-large
#
#    # Fast and small
#    ollama pull all-minilm
#
#    # Multilingual (Chinese-friendly)
#    ollama pull bge-m3
#
#    # Multilingual (50+ languages)
#    ollama pull paraphrase-multilingual
#
#    # High quality English
#    ollama pull bge-large-en-v1.5
#
#    # Retrieval-optimized
#    ollama pull snowflake-arctic-embed

# 2. Pull chat models (for LLM operations):
#
#    # Qwen (excellent multilingual, especially Chinese)
#    ollama pull qwen2.5:7b
#    ollama pull qwen2.5:14b
#    ollama pull qwen2.5:32b
#
#    # Llama (strong English)
#    ollama pull llama3.2
#    ollama pull llama3.1:70b
#
#    # Mistral (efficient)
#    ollama pull mistral
#
#    # Gemma (Google's model - for chat, not embeddings)
#    ollama pull gemma2:9b
#    ollama pull gemma2:27b

# 3. Verify models are available:
#    ollama list

# 4. Use this config file:
#    cp examples/ollama_embedding_models.yml ./your_project/settings.yml

# 5. Run GraphRAG:
#    python -m graphrag.index --root ./your_project

# =============================================================================
# CHOOSING THE RIGHT EMBEDDING MODEL
# =============================================================================

# For English-only content:
# - Best quality: mxbai-embed-large (1024 dims)
# - Best balance: nomic-embed-text (768 dims)
# - Fastest: all-minilm (384 dims)

# For Multilingual (including Chinese):
# - Best: bge-m3 (1024 dims, strong Chinese)
# - Good: paraphrase-multilingual (768 dims, 50+ languages)

# For RAG specifically:
# - Retrieval tasks: snowflake-arctic-embed or mxbai-embed-large
# - General purpose: nomic-embed-text (recommended)
# - Speed critical: all-minilm

# Note on Qwen:
# - Qwen2.5 models (7b, 14b, 32b, 72b) are LLMs for chat/generation
# - Use them as chat models, not embedding models
# - For Qwen ecosystem embeddings, use bge-m3 (same org, optimized for Chinese)

# Note on Gemma:
# - Gemma2 models (2b, 9b, 27b) are LLMs for chat/generation
# - Google doesn't provide Gemma embedding models
# - For similar quality, use nomic-embed-text or mxbai-embed-large

# =============================================================================
# PERFORMANCE COMPARISON
# =============================================================================

# Benchmark (approximate, on M1 Mac):
#
# Model                    | Dims | Tokens/sec | Quality | Memory
# -------------------------|------|------------|---------|--------
# all-minilm              | 384  | ~5000      | ★★★☆☆  | 23 MB
# nomic-embed-text        | 768  | ~3000      | ★★★★☆  | 274 MB
# mxbai-embed-large       | 1024 | ~1500      | ★★★★★  | 669 MB
# snowflake-arctic-embed  | 1024 | ~2000      | ★★★★★  | 669 MB
# bge-m3                  | 1024 | ~1200      | ★★★★★  | 2.3 GB
# bge-large-en-v1.5       | 1024 | ~1000      | ★★★★★  | 1.34 GB

# =============================================================================
# TROUBLESHOOTING
# =============================================================================

# Model not found:
#   ollama pull <model-name>

# Out of memory:
#   - Use smaller embedding model (all-minilm)
#   - Reduce concurrent_requests
#   - Reduce batch_size in embed_text config

# Slow embedding:
#   - Use faster model (all-minilm or nomic-embed-text)
#   - Increase concurrent_requests
#   - Ensure Ollama is using GPU

# Poor search quality:
#   - Use higher quality model (mxbai-embed-large)
#   - Ensure same embedding model for index and query
#   - Check if multilingual model needed
