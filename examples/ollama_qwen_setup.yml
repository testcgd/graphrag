# Example: Qwen Models for GraphRAG (中文优化配置)
#
# Qwen (通义千问) is Alibaba's excellent multilingual LLM series
# with exceptional Chinese language support. This configuration shows
# how to use Qwen models with Ollama for GraphRAG.
#
# Qwen 优势:
# - 优秀的中文理解和生成能力
# - 支持超长上下文 (最高 128K tokens)
# - 开源且性能强大
# - 多种规模可选 (0.5B - 72B)
#
# Prerequisites:
# 1. Install Ollama: https://ollama.ai
# 2. Pull Qwen models: ollama pull qwen2.5:14b
# 3. Pull embedding model: ollama pull bge-m3

# =============================================================================
# QWEN MODEL OPTIONS
# =============================================================================
#
# Qwen2.5 Series (Latest, Recommended):
# - qwen2.5:0.5b  - Tiny, ultra-fast (512 MB)
# - qwen2.5:1.5b  - Small, very fast (934 MB)
# - qwen2.5:3b    - Compact, fast (1.9 GB)
# - qwen2.5:7b    - Balanced (4.7 GB) ← Good for indexing
# - qwen2.5:14b   - High quality (9.0 GB) ← Recommended default
# - qwen2.5:32b   - Very high quality (20 GB) ← For queries
# - qwen2.5:72b   - Best quality (43 GB) ← Production queries
#
# Qwen2.5-Coder Series (Specialized for code):
# - qwen2.5-coder:7b
# - qwen2.5-coder:32b
#
# Note: All Qwen models support both English and Chinese excellently

# =============================================================================
# CONFIGURATION 1: Balanced (Recommended)
# =============================================================================

models:
  default_chat_model:
    type: ollama_chat
    model: qwen2.5:14b  # 14B model, excellent quality
    api_base: http://localhost:11434/v1
    max_tokens: 4000
    temperature: 0.0  # Deterministic for consistent extraction
    tokens_per_minute: 0  # Unlimited for local
    requests_per_minute: 0
    concurrent_requests: 4
    model_supports_json: false
    async_mode: threaded

  default_embedding_model:
    type: ollama_embedding
    model: bge-m3  # BGE-M3: Best for Chinese+English embeddings
    api_base: http://localhost:11434/v1
    tokens_per_minute: 0
    requests_per_minute: 0
    concurrent_requests: 6
    async_mode: threaded

# Standard indexing and query configuration
chunking:
  chunk_size: 1200
  chunk_overlap: 100

extract_graph:
  max_gleanings: 1

community_reports:
  max_length: 2000
  max_input_length: 8000

