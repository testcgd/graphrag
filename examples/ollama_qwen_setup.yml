# =============================================================================
# SETUP INSTRUCTIONS (设置说明)
# =============================================================================

# 1. 安装 Ollama:
#    curl -fsSL https://ollama.ai/install.sh | sh

# 2. 拉取 Qwen 模型 (根据硬件选择):
#
#    # 8GB 内存
#    ollama pull qwen2.5:7b
#
#    # 16GB 内存 (推荐)
#    ollama pull qwen2.5:14b
#
#    # 32GB+ 内存
#    ollama pull qwen2.5:32b
#
#    # 64GB+ 内存 (最佳质量)
#    ollama pull qwen2.5:72b

# 3. 拉取嵌入模型:
#
#    # BGE-M3 (中文优化，推荐)
#    ollama pull bge-m3
#
#    # 或者使用其他嵌入模型:
#    ollama pull nomic-embed-text  # 通用，质量好
#    ollama pull mxbai-embed-large  # 高质量英文

# 4. 验证模型:
#    ollama list

# 5. 使用配置:
#    cp examples/ollama_qwen_setup.yml ./your_project/settings.yml

# 6. 运行 GraphRAG:
#    # 构建索引
#    python -m graphrag.index --root ./your_project
#
#    # 查询
#    python -m graphrag.query --root ./your_project --method local "你的问题"

# =============================================================================
# EMBEDDING MODEL RECOMMENDATIONS FOR QWEN (嵌入模型推荐)
# =============================================================================

# 最佳中文嵌入模型:
# 1. bge-m3 (推荐)
#    - 1024 维
#    - 对中文和英文都有优秀支持
#    - 多语言能力强
#    ollama pull bge-m3
#
# 2. bge-large-zh-v1.5 (中文专用)
#    - 1024 维
#    - 专门为中文优化
#    ollama pull bge-large-zh-v1.5
#
# 3. nomic-embed-text (通用)
#    - 768 维
#    - 英文为主，中文支持一般
#    ollama pull nomic-embed-text

# =============================================================================
# PERFORMANCE TIPS (性能优化建议)
# =============================================================================

# 1. 内存不足时:
#    - 使用 qwen2.5:7b 或更小的模型
#    - 减少 concurrent_requests
#    - 使用更小的嵌入模型 (nomic-embed-text)

# 2. 加速索引:
#    - 增加 concurrent_requests (如果内存充足)
#    - 使用较小的模型用于索引
#    - 减少 max_gleanings

# 3. 提高质量:
#    - 使用 qwen2.5:32b 或 72b
#    - 增加 max_gleanings
#    - 使用 bge-m3 嵌入模型

# 4. 中文优化:
#    - chunk_size 可以设置得更小 (800-1000)
#    - 使用 BGE 系列嵌入模型
#    - temperature 设置为 0.0 以获得更一致的结果

# =============================================================================
# USE CASES (使用场景)
# =============================================================================

# Scenario 1: 完全本地的中文知识图谱
# - Chat: qwen2.5:14b
# - Embedding: bge-m3
# - 成本: 0 (仅电费)
# - 隐私: 完全本地，数据不出本地

# Scenario 2: 成本优化的混合方案
# - 索引: qwen2.5:7b (本地，免费)
# - 查询: GPT-4 (云端，高质量)
# - 成本节省: 50-70%

# Scenario 3: 代码知识库
# - Chat: qwen2.5-coder:7b 或 32b
# - Embedding: nomic-embed-text
# - 用途: 代码库分析和问答

# =============================================================================
# TROUBLESHOOTING (故障排除)
# =============================================================================

# 问题: 内存不足 (Out of Memory)
# 解决:
#   - 使用更小的模型: qwen2.5:7b 或 3b
#   - 减少 concurrent_requests 到 2
#   - 关闭其他应用程序

# 问题: 中文乱码或质量差
# 解决:
#   - 确保使用 qwen2.5 系列 (不是 qwen1 或 qwen2)
#   - 使用 BGE 系列嵌入模型
#   - 检查输入文本编码 (应该是 UTF-8)

# 问题: 速度慢
# 解决:
#   - 使用更小的模型 (qwen2.5:7b)
#   - 确保 Ollama 使用 GPU
#   - 增加 concurrent_requests

# 问题: 找不到模型
# 解决:
#   ollama pull qwen2.5:14b
#   ollama pull bge-m3
#   ollama list  # 验证

